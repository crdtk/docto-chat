[project]
name = "streaming-llm-chat"
version = "0.1.0"
description = "Streaming LLM chat server with real-time token generation"
requires-python = ">=3.12"
dependencies = [
    "transformers",
    "torch",
    "flask",
    "flask-cors",
    "requests",
    "tqdm",
    "python-dotenv",
    "flasgger",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "locust",
]
quantization = [
    "bitsandbytes",
]
